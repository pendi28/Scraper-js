<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendi Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

        /* ── Header ── */
        header {
            padding: 14px 18px; border-bottom: 1px solid #21262d;
            background: rgba(13,17,23,0.95); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            display: none; background: none; border: none; color: #2dd4bf;
            font-size: 1.3rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
        }
        .back-btn:hover { background: rgba(45,212,191,0.1); }
        header h1 { font-size: 1.05rem; font-weight: 700; flex: 1; }
        .quality-select {
            background: #161b22; border: 1px solid #30363d; color: #e6edf3;
            border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; cursor: pointer;
            display: none;
        }

        /* ── Browse view ── */
        #browseView { padding: 16px; }
        .browse-title {
            font-size: 0.85rem; color: #8b949e; font-weight: 600;
            margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .drama-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .drama-card {
            border-radius: 10px; overflow: hidden; cursor: pointer;
            background: #161b22; border: 1px solid #21262d;
            transition: transform 0.18s, border-color 0.18s;
        }
        .drama-card:hover { transform: scale(1.03); border-color: #2dd4bf; }
        .drama-card img {
            width: 100%; aspect-ratio: 2/3; object-fit: cover;
            background: #21262d; display: block;
        }
        .drama-card .card-info { padding: 8px; }
        .drama-card .card-title { font-size: 0.72rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
        .drama-card .card-meta { font-size: 0.65rem; color: #8b949e; }
        .drama-card .card-status {
            display: inline-block; font-size: 0.6rem; padding: 1px 6px;
            border-radius: 4px; margin-bottom: 3px;
        }
        .drama-card .card-status.ongoing { background: rgba(45,212,191,0.15); color: #2dd4bf; }
        .drama-card .card-status.completed { background: rgba(139,148,158,0.15); color: #8b949e; }

        /* ── Player view ── */
        #playerView { display: none; }
        .player-wrap { background: #000; width: 100%; }
        .info-bar { padding: 14px 18px; border-bottom: 1px solid #21262d; }
        .drama-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
        .now-playing { font-size: 0.82rem; color: #2dd4bf; min-height: 18px; }

        .ep-section { padding: 16px 18px; }
        .ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ep-header h3 { font-size: 0.85rem; color: #8b949e; font-weight: 600; }
        .ep-count { font-size: 0.72rem; background: rgba(139,148,158,0.15); color: #8b949e; padding: 3px 10px; border-radius: 6px; }
        .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
        .ep-btn {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background: #161b22; border: 1px solid #21262d; border-radius: 9px;
            cursor: pointer; font-size: 0.75rem; font-weight: 600; color: #e6edf3;
            transition: all 0.18s; text-align: center; padding: 4px; line-height: 1.25;
        }
        .ep-btn:hover { border-color: rgba(45,212,191,0.4); background: #1c2129; }
        .ep-btn.active {
            background: #0d9488; border-color: #0d9488;
            box-shadow: 0 0 14px rgba(13,148,136,0.35); transform: scale(1.04);
        }

        /* ── Loading & Status ── */
        .full-loading {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 200px; gap: 12px;
            color: #8b949e; grid-column: 1/-1;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #21262d;
            border-top-color: #2dd4bf; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .scraping-msg { font-size: 0.8rem; color: #2dd4bf; text-align: center; }
        .status-msg { color: #8b949e; text-align: center; padding: 30px 0; grid-column: 1/-1; font-size: 0.85rem; }

        :root { --plyr-color-main: #0d9488; }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header>
    <button class="back-btn" id="backBtn">&#8592;</button>
    <h1 id="headerTitle">Pendi Player</h1>
    <select class="quality-select" id="qualitySelect">
        <option value="">Kualitas</option>
    </select>
</header>

<!-- ── Browse View ── -->
<div id="browseView">
    <p class="browse-title">Daftar Drama</p>
    <div class="drama-grid" id="dramaGrid">
        <div class="full-loading" style="grid-column:1/-1">
            <div class="spinner"></div>
            <span>Memuat daftar drama...</span>
        </div>
    </div>
</div>

<!-- ── Player View ── -->
<div id="playerView">
    <div class="player-wrap">
        <video id="mainPlayer" playsinline></video>
    </div>
    <div class="info-bar">
        <div class="drama-name" id="dramaName"></div>
        <div class="now-playing" id="nowPlaying">Pilih episode untuk mulai...</div>
    </div>
    <div class="ep-section">
        <div class="ep-header">
            <h3>Episodes</h3>
            <span class="ep-count" id="epCount"></span>
        </div>
        <div class="ep-grid" id="epGrid">
            <div class="full-loading">
                <div class="spinner"></div>
                <span class="scraping-msg">Mengambil episode otomatis...<br><small style="opacity:.6">Proses ini butuh beberapa detik</small></span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
// ── State ──
let currentEp  = null;
let activeBtn  = null;
let player     = null;

const browseView   = document.getElementById('browseView');
const playerView   = document.getElementById('playerView');
const dramaGrid    = document.getElementById('dramaGrid');
const epGrid       = document.getElementById('epGrid');
const epCountEl    = document.getElementById('epCount');
const nowPlaying   = document.getElementById('nowPlaying');
const dramaName    = document.getElementById('dramaName');
const qualitySelect = document.getElementById('qualitySelect');
const backBtn      = document.getElementById('backBtn');
const headerTitle  = document.getElementById('headerTitle');

// ── Player init ──
function initPlayer() {
    if (player) return;
    player = new Plyr('#mainPlayer', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen']
    });
}

// ── Navigation ──
function showBrowse() {
    browseView.style.display = '';
    playerView.style.display = 'none';
    backBtn.style.display    = 'none';
    qualitySelect.style.display = 'none';
    headerTitle.textContent  = 'Pendi Player';
    if (player) player.pause();
}

function showPlayer(drama) {
    browseView.style.display = 'none';
    playerView.style.display = '';
    backBtn.style.display    = 'inline-block';
    headerTitle.textContent  = drama.title;
    dramaName.textContent    = drama.title;
    nowPlaying.textContent   = 'Memuat episode...';
    epCountEl.textContent    = '';
    epGrid.innerHTML = `
        <div class="full-loading">
            <div class="spinner"></div>
            <span class="scraping-msg">Mengambil episode otomatis...<br>
            <small style="opacity:.6">Proses ini butuh beberapa detik</small></span>
        </div>`;
    initPlayer();
    loadEpisodes(drama.bookId, drama.cover);
}

backBtn.addEventListener('click', showBrowse);

// ── Play episode ──
function playEpisode(ep, btn, fallbackPoster) {
    currentEp = ep;
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = btn;
    btn.classList.add('active');

    qualitySelect.innerHTML = '<option value="">Kualitas</option>';
    if (ep.sources && ep.sources.length > 0) {
        ep.sources.sort((a, b) => b.quality - a.quality).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.url;
            opt.textContent = s.quality + 'p';
            if (s.url === ep.playUrl) opt.selected = true;
            qualitySelect.appendChild(opt);
        });
        qualitySelect.style.display = 'block';
    }

    player.source = {
        type: 'video',
        poster: ep.thumbnailUrl || fallbackPoster || '',
        sources: [{ src: ep.playUrl, type: 'video/mp4' }]
    };
    nowPlaying.textContent = '▶ ' + ep.title;
    player.play().catch(() => {});
    document.querySelector('.player-wrap').scrollIntoView({ behavior: 'smooth' });
}

// Ganti kualitas
qualitySelect.addEventListener('change', () => {
    if (!qualitySelect.value || !currentEp) return;
    const wasPlaying = !player.paused;
    const t = player.currentTime;
    player.source = {
        type: 'video',
        poster: currentEp.thumbnailUrl || '',
        sources: [{ src: qualitySelect.value, type: 'video/mp4' }]
    };
    player.once('canplay', () => {
        player.currentTime = t;
        if (wasPlaying) player.play().catch(() => {});
    });
});

// ── Load episodes (auto-scrape via API) ──
async function loadEpisodes(bookId, fallbackPoster) {
    try {
        const res = await fetch(`/api/episodes/${bookId}`);
        const episodes = await res.json();

        if (episodes.error) {
            epGrid.innerHTML = `<div class="status-msg">❌ ${episodes.error}</div>`;
            nowPlaying.textContent = 'Gagal memuat episode.';
            return;
        }

        epCountEl.textContent = `${episodes.length} Episode`;
        epGrid.innerHTML = '';
        activeBtn = null;

        episodes.forEach((ep, i) => {
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.textContent = ep.title;
            btn.addEventListener('click', () => playEpisode(ep, btn, fallbackPoster));
            epGrid.appendChild(btn);
            if (i === 0) setTimeout(() => btn.click(), 300);
        });

        nowPlaying.textContent = 'Pilih episode untuk mulai...';

    } catch (err) {
        epGrid.innerHTML = `<div class="status-msg">❌ ${err.message}</div>`;
    }
}

// ── Load catalog (auto-fetch via API) ──
async function loadCatalog() {
    try {
        const res = await fetch('/api/catalog');
        const catalog = await res.json();

        if (!catalog.length || catalog.error) {
            dramaGrid.innerHTML = `<div class="status-msg" style="grid-column:1/-1">❌ Katalog kosong atau gagal dimuat.</div>`;
            return;
        }

        dramaGrid.innerHTML = '';
        catalog.forEach(drama => {
            const card = document.createElement('div');
            card.className = 'drama-card';
            card.innerHTML = `
                <img src="${drama.cover}" alt="${drama.title}"
                     onerror="this.style.background='#21262d';this.src='data:image/svg+xml,<svg/>'">
                <div class="card-info">
                    <div class="card-status ${drama.status === 'Ongoing' ? 'ongoing' : 'completed'}">${drama.status}</div>
                    <div class="card-title">${drama.title}</div>
                    <div class="card-meta">${drama.totalEps ? drama.totalEps + ' ep' : ''}${drama.tags ? ' · ' + drama.tags.split(',')[0] : ''}</div>
                </div>`;
            card.addEventListener('click', () => showPlayer(drama));
            dramaGrid.appendChild(card);
        });

    } catch (err) {
        dramaGrid.innerHTML = `<div class="status-msg" style="grid-column:1/-1">❌ ${err.message}</div>`;
    }
}

// ── Init ──
loadCatalog();
</script>
</body>
</html>
